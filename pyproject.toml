[project]
name = "proof"
version = "0.1.0"
description = "Proof is a model agnostic data analysis framework for Python."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.27.0",
]

[project.scripts]
proof = "proof.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"