[project]
name = "proof"
version = "1.0.0"
description = "Proof is a model agnostic data analysis framework for Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "rich-pyfiglet>=2.0.1",
    "typer>=0.27.0",
]

[project.scripts]
proof = "proof.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]
extend-exclude = ["src/proof/copy_files"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line length is handled by the formatter
    "N818", # exceptions in this project use an Exception suffix
]

[tool.ruff.lint.isort]
known-first-party = ["proof"]
